services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pustaka_sekolah_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=/app/data/pustaka.db
      - UPLOADS_DIR=/app/uploads/ebooks
      - JWT_SECRET=change-this-secret-key-in-production-astesia
    volumes:
      - pustaka_data:/app/data
      - pustaka_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pustaka_data:
    driver: local
  pustaka_uploads:
    driver: local
