name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Lint, Test, and Build PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Seed Database Test Baseline
        run: npm run db:seed

      - name: Run Vitest Unit & Integration Tests
        run: npm run test

      - name: Build PWA Client & Bundle Check
        run: npm run build
